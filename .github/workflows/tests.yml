name: Clinical Variant Annotation ACMG CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pandas numpy scipy matplotlib seaborn
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify full ACMG clinical annotation pipeline
        run: |
          python scripts/generate_clinical_cohort.py
          python scripts/run_acmg_annotator.py
          python scripts/plot_clinical_results.py
